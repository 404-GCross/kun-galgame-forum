# CI test gate for the Go module under apps/api.
#
#   unit — build + vet + errcheck + `go test ./...`, no external services.
#
# errcheck is here because `go vet` does not catch a discarded error, and a
# discarded gorm error is the repo's worst failure mode: the write silently
# does nothing and the request still answers 200. See apps/api/.errcheck-exclude
# for the (short) list of calls whose error is genuinely nothing to act on.
#
# Every test in apps/api is a pure unit test (no test reads a DB / Meilisearch
# env var), so a single always-green unit job is the whole gate — there is no
# integration job because there is nothing service-gated to run. If a
# service-backed test is ever added, spin its containers up in a second job
# then (mirror the pattern; don't pre-build it).
#
# Independent of build.yml on purpose — deploys are not blocked while this
# gate settles. Add `needs: test` to build.yml once it has proven green.

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/api

jobs:
  unit:
    name: unit (build · vet · errcheck · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go run github.com/kisielk/errcheck@v1.9.0 -exclude .errcheck-exclude ./...
      - run: go test ./...
