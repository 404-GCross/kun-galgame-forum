#:schema https://json.schemastore.org/any.json

# Config file for air - Live reload for Go apps
# https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
# The `.exe` suffix is carried on every OS, not just Windows. Air has no
# per-OS config section (cfgBuild has no such field, and an unknown TOML table
# is silently dropped), so the choice is one name everywhere or none that
# works: on Windows os/exec resolves the entrypoint through PATHEXT and refuses
# a suffix-less binary, while on Linux/macOS the name is cosmetic and the file
# runs regardless. tmp/ is gitignored, so nothing about it is user-facing.
cmd = "go build -o ./tmp/server.exe ./cmd/server"
entrypoint = ["./tmp/server.exe"]
# Watch these extensions
include_ext = ["go", "tpl", "tmpl", "html", "env"]
# Exclude directories
exclude_dir = ["assets", "tmp", "vendor", "testdata", "build", "node_modules"]
# Exclude files
exclude_file = []
# Exclude regex patterns
exclude_regex = ["_test.go", ".*_test\\.go"]
# Exclude unchanged files
exclude_unchanged = false
# Follow symlinks
follow_symlink = false
# Additional args for binary
args_bin = []
# Delay before restarting (ms)
delay = 1000
# Log file for build errors
log = "build-errors.log"
# Stop on error
stop_on_error = false
# Send interrupt signal
send_interrupt = false
# Kill delay
kill_delay = "0s"
# Rerun on error
rerun = false
rerun_delay = 500

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false
main_only = false
silent = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
